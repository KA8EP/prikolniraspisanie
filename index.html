<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание ИЭК</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #1e1e1e; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 450px; padding: 20px; display: flex; flex-direction: column; }
        
        header { display: flex; align-items: center; justify-content: center; margin-bottom: 40px; margin-top: 20px; position: relative; }
        .logo-icon { width: 30px; height: 30px; background: linear-gradient(135deg, #ff6b6b, #ff8e8e); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); margin-right: 15px; box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3); }
        h1 { font-size: 24px; font-weight: 500; letter-spacing: 0.5px; }
        .bell-icon { background-color: #0084b4; color: #ffb800; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-left: 10px; font-size: 16px; cursor: pointer; }

        .btn { display: block; text-decoration: none; background-color: #005f82; color: #ffffff; border: none; border-radius: 8px; padding: 15px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; margin-bottom: 20px; transition: background-color 0.2s; text-align: center; }
        .btn:hover { background-color: #007399; }

        .select-container { position: relative; margin-bottom: 30px; }
        select { width: 100%; background-color: #1e1e1e; color: #ffffff; border: 1px solid #005f82; border-radius: 8px; padding: 15px; font-size: 16px; appearance: none; outline: none; cursor: pointer; }
        select:focus { border-color: #0084b4; }
        .select-container::after { content: '▼'; position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #ffffff; font-size: 12px; pointer-events: none; }

        .group-list { display: flex; flex-direction: column; gap: 15px; }

        .screen { display: none; animation: fadeIn 0.3s; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .back-btn { background: transparent; color: #0084b4; border: none; font-size: 16px; cursor: pointer; margin-bottom: 20px; text-align: left; padding: 0; }
        .back-btn:hover { text-decoration: underline; }
        .schedule-title { font-size: 20px; margin-bottom: 20px; text-align: center; color: #ffb800; }
        
        /* Переключатель недель */
        .week-toggle { display: flex; background-color: #2a2a2a; border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
        .week-toggle button { flex: 1; background: transparent; color: #aaaaaa; border: none; padding: 12px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .week-toggle button.active { background-color: #005f82; color: #ffffff; }

        .day-header { font-size: 16px; font-weight: bold; color: #ffffff; margin: 25px 0 15px 0; padding-bottom: 5px; border-bottom: 2px solid #005f82; text-transform: uppercase; }
        .day-header:first-child { margin-top: 0; }

        .schedule-card { background-color: #2a2a2a; border-radius: 8px; padding: 15px; margin-bottom: 15px; border-left: 4px solid #0084b4; }
        .schedule-time { font-size: 14px; color: #aaaaaa; margin-bottom: 5px; font-weight: bold; }
        .schedule-lesson { font-size: 15px; line-height: 1.4; margin-bottom: 5px; }
        .schedule-room { font-size: 13px; color: #ffb800; }
        .empty-msg { text-align: center; color: #aaaaaa; margin-top: 20px; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="logo-icon"></div>
        <h1>Расписание ИЭК</h1>
        <div class="bell-icon">🔔</div>
    </header>

    <div id="screen-main" class="screen active">
        <button class="btn" onclick="showGroups()">Группы</button>
        <button class="btn" style="opacity: 0.7; cursor: not-allowed;">Преподаватели (в разработке)</button>
    </div>

    <div id="screen-groups" class="screen">
        <button class="back-btn" onclick="showScreen('screen-main')">← Назад</button>
        <div class="select-container">
            <select id="course-select" onchange="updateGroups()">
                <option value="">Выберите курс</option>
                <option value="1">1 курс</option>
                <option value="3">3 курс</option>
            </select>
        </div>
        <div id="group-list" class="group-list"></div>
    </div>

    <div id="screen-schedule" class="screen">
        <button class="back-btn" onclick="showScreen('screen-groups')">← Назад к группам</button>
        <h2 id="schedule-title" class="schedule-title"></h2>

        <div id="schedule-content"></div>

    let currentCourse = '';
    let currentGroup = '';
    let currentWeek = 'top'; // По умолчанию верхняя неделя

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(screen => screen.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function showGroups() {
        showScreen('screen-groups');
        document.getElementById('course-select').value = "";
        document.getElementById('group-list').innerHTML = '';
    }

    function updateGroups() {
        const course = document.getElementById('course-select').value;
        const groupList = document.getElementById('group-list');
        groupList.innerHTML = ''; 

        if (course && scheduleData[course]) {
            for (const groupName in scheduleData[course]) {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.textContent = groupName;
                btn.onclick = () => openSchedule(course, groupName);
                groupList.appendChild(btn);
            }
        } else if (course) {
            groupList.innerHTML = '<div class="empty-msg">Для этого курса пока нет данных.</div>';
        }
    }

    // Переключение недель
    function setWeek(week) {
        currentWeek = week;
        
        // Меняем активную кнопку
        if (week === 'top') {
            document.getElementById('btn-top-week').classList.add('active');
            document.getElementById('btn-bottom-week').classList.remove('active');
        } else {
            document.getElementById('btn-bottom-week').classList.add('active');
            document.getElementById('btn-top-week').classList.remove('active');
        }
        
        // Перерисовываем расписание
        renderSchedule();
    }

    function openSchedule(course, groupName) {
        currentCourse = course;
        currentGroup = groupName;
        document.getElementById('schedule-title').textContent = groupName;
        
        // По умолчанию ставим верхнюю неделю
        setWeek('top');
        
        showScreen('screen-schedule');
    }

    function renderSchedule() {
        const content = document.getElementById('schedule-content');
        content.innerHTML = ''; 

        let lessons = scheduleData[currentCourse][currentGroup];

        if (lessons && lessons.length > 0) {
            // Фильтруем по неделе (оставляем те, что "both" или совпадают с выбранной неделей)
            let filteredLessons = lessons.filter(lesson => 
                lesson.week === 'both' || lesson.week === currentWeek
            );

            // Сортировка по дню и времени
            const dayOrder = { "ПОНЕДЕЛЬНИК": 1, "ВТОРНИК": 2, "СРЕДА": 3, "ЧЕТВЕРГ": 4, "ПЯТНИЦА": 5, "СУББОТА": 6, "ВОСКРЕСЕНЬЕ": 7 };
            filteredLessons.sort((a, b) => {
                const dayA = dayOrder[a.day] || 8;
                const dayB = dayOrder[b.day] || 8;
                if (dayA !== dayB) return dayA - dayB;
                return a.time.localeCompare(b.time);
            });

            let currentDay = '';
            
            filteredLessons.forEach(lesson => {
                if (lesson.day !== currentDay) {
                    currentDay = lesson.day;
                    const dayHeader = document.createElement('div');
                    dayHeader.className = 'day-header';
                    dayHeader.textContent = currentDay;
                    content.appendChild(dayHeader);
                }

                const card = document.createElement('div');
                card.className = 'schedule-card';
                card.innerHTML = `
                    <div class="schedule-time">${lesson.time}</div>
                    <div class="schedule-lesson">${lesson.lesson}</div>
                    <div class="schedule-room">${lesson.teacher} | ауд. ${lesson.room}</div>
                `;
                content.appendChild(card);
            });

            if (filteredLessons.length === 0) {
                content.innerHTML = '<div class="empty-msg">На этой неделе занятий нет.</div>';
            }

        } else {
            content.innerHTML = '<div class="empty-msg">Расписание для этой группы пока не добавлено.</div>';
        }
    }
