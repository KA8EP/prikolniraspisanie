<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15191a">
<title>Расписание ИГУ</title>
<style>
:root{
  --bg:#15191a; --panel:#1b2022; --panel2:#202629; --teal:#006d89;
  --teal2:#087b98; --text:#f2f0eb; --muted:#aeb8bb; --line:#687174;
  --gold:#3b2d00; --pink:#790d70; --pink-line:#a22a95;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
button,select,input{font:inherit}
button{cursor:pointer}
.app{max-width:1040px;margin:0 auto;padding:18px 22px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 auto 24px;max-width:920px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.flame{width:28px;height:36px;flex:none}
.brand-title{font-size:clamp(25px,4vw,36px);font-weight:400;letter-spacing:-.7px;white-space:nowrap}
.bell{border:0;background:var(--teal);color:#ffd45b;border-radius:13px;width:46px;height:46px;font-size:21px;box-shadow:0 4px 14px #0004}
.back{border:1px solid #3a464a;background:#20282b;color:#eaf2f3;padding:10px 14px;border-radius:11px}
.home-actions{display:flex;flex-direction:column;align-items:center;gap:28px;margin:44px auto 0;max-width:440px}
.primary{border:0;background:var(--teal);color:white;font-weight:700;border-radius:13px;padding:14px 20px;min-height:48px;transition:.18s;box-shadow:0 4px 12px #0003}
.primary:hover,.primary:focus-visible{background:var(--teal2);transform:translateY(-1px)}
.home-actions .primary{width:min(100%,330px);font-size:16px}
.page{max-width:900px;margin:0 auto}
.page-title{text-align:center;font-size:25px;margin:6px 0 8px}
.subtle{text-align:center;color:var(--muted);font-size:14px;margin:0 0 24px}
.selector-wrap{max-width:620px;margin:28px auto 22px}
.field-label{display:block;color:#d9e0e1;font-size:14px;margin:0 0 8px}
select,.search{width:100%;background:#171c1e;color:#f4f5f5;border:1px solid #3d555e;border-radius:9px;padding:13px 14px;outline:none}
select:focus,.search:focus{border-color:#087da4;box-shadow:0 0 0 3px #006d8938}
.group-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:760px;margin:24px auto}
.group-card{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-height:68px;padding:13px 12px}
.group-card strong{font-size:15px}
.group-card small{font-size:12px;font-weight:400;color:#d6e8ec;line-height:1.3}
.group-card .profile{color:#b7c3c6;font-size:11px}
.empty{color:var(--muted);text-align:center;padding:28px 12px}
.week-panel{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:16px 0 22px}
.week-label{color:#e9eeee;font-size:15px}
.week-switch{display:flex;gap:5px;background:#202629;padding:4px;border:1px solid #3b484c;border-radius:12px}
.week-btn{border:0;background:transparent;color:#d4dcde;padding:9px 16px;border-radius:9px;font-weight:700}
.week-btn.active{background:var(--teal);color:#fff;box-shadow:0 2px 8px #0005}
.note{max-width:780px;margin:0 auto 18px;text-align:center;color:#93a0a3;font-size:12px;line-height:1.45}
.schedule-head{text-align:center;margin:8px 0 14px}
.schedule-head h2{font-size:25px;margin:0 0 6px}
.schedule-head p{color:var(--muted);font-size:13px;line-height:1.4;margin:0}
.day{border:1px solid #827e6c;margin:0 0 17px;overflow:hidden;border-radius:2px;background:#171b1c}
.day-title{background:var(--gold);color:#f2e6bf;text-align:center;font-size:14px;font-weight:700;padding:8px 10px;border-bottom:1px solid #8c8261}
.lesson{display:grid;grid-template-columns:104px 1fr;gap:0;border-bottom:1px solid #596164;min-height:76px}
.lesson:last-child{border-bottom:0}
.lesson-time{display:flex;align-items:center;justify-content:center;text-align:center;padding:12px 8px;color:#e5e8e8;font-size:14px;border-right:1px solid #596164;font-weight:700}
.lesson-body{padding:11px 14px;display:flex;flex-direction:column;gap:5px}
.lesson-subject{font-size:15px;line-height:1.35;font-weight:700}
.lesson-meta{font-size:13px;color:#c4ccce;line-height:1.35}
.lesson-room{font-size:13px;color:#e6e8e8}
.lesson.special{background:var(--pink);border-color:var(--pink-line)}
.lesson.special .lesson-meta,.lesson.special .lesson-room{color:#f1dff0}
.lesson-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.pill{display:inline-block;border-radius:20px;padding:3px 8px;font-size:10px;font-weight:700;background:#ffffff1b;color:#f6eaf5;border:1px solid #ffffff25}
.pill.regular{background:#006d8938;color:#bdebf5;border-color:#1689a5}
.teacher-list{max-width:720px;margin:20px auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.teacher-card{border:1px solid #354247;background:#1c2325;color:#f0f4f5;border-radius:10px;text-align:left;padding:13px 15px}
.teacher-card:hover{border-color:#087b98;background:#202a2d}
.teacher-card small{display:block;color:#aebabe;margin-top:4px}
.teacher-lesson{display:grid;grid-template-columns:130px 1fr;gap:0;border:1px solid #606b6e;margin-bottom:9px;background:#1a2022}
.teacher-lesson .lesson-time{border-right:1px solid #606b6e}
.teacher-lesson .lesson-body{padding:12px}
.teacher-lesson .group-tag{color:#8ed9eb;font-size:12px;font-weight:700}
.modal-backdrop{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.modal{width:min(100%,380px);background:#202729;border:1px solid #435257;border-radius:16px;padding:22px;box-shadow:0 20px 70px #0009;text-align:center}
.modal h3{margin:0 0 10px}.modal p{color:#c1cbcd;line-height:1.5;font-size:14px}
.modal .primary{width:100%;margin-top:8px}
.footer{text-align:center;color:#667477;font-size:11px;margin:34px 0 0}
@media(max-width:620px){
 .app{padding:12px 13px 40px}
 .topbar{margin-bottom:18px}
 .brand-title{font-size:25px}
 .bell{width:42px;height:42px}
 .group-grid,.teacher-list{grid-template-columns:1fr}
 .lesson{grid-template-columns:82px 1fr}
 .lesson-time{font-size:12px;padding:8px 4px}
 .lesson-body{padding:10px}
 .lesson-subject{font-size:14px}
 .lesson-meta,.lesson-room{font-size:12px}
 .teacher-lesson{grid-template-columns:95px 1fr}
 .week-panel{gap:8px}
 .week-btn{padding:9px 12px}
}
</style>
</head>

</div>

rtProfile":"Техническая защита информации","courseLabel":"4 курс","extra":[],"courseNote":"Занятия по дисциплине «Элективные дисциплины (модули) по физической культуре и спорту» для 3–4 курса проходят по расписанию физкультурно-оздоровительного центра ИГУ."}];
const DAYS = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const TIMES = ["08.30-10.00","10.10-11.40","11.50-13.20","13.50-15.20","15.30-17.00","17.10-18.40"];
let page = "home";
let selectedCourse = 1;
let selectedGroupId = null;
let selectedTeacher = "";
let week = "even";
let teacherSearch = "";

const main = document.getElementById("main");
const backBtn = document.getElementById("backBtn");
const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const currentGroup = () => GROUPS.find(g => g.id === selectedGroupId);
const weekName = () => week === "even" ? "ЧЁТНАЯ" : "НЕЧЁТНАЯ";
const visibleEvents = events => events.filter(e => e.week === "all" || e.week === week)
  .sort((a,b) => TIMES.indexOf(a.time)-TIMES.indexOf(b.time));

function weekControl(){
  return `<div class="week-panel">
    <span class="week-label">Текущая неделя:</span>
    <div class="week-switch">
      <button class="week-btn ${week==="even"?"active":""}" data-week="even">Чётная</button>
      <button class="week-btn ${week==="odd"?"active":""}" data-week="odd">Нечётная</button>
    </div>
  </div>
  <p class="note">Неделя выбирается вручную: в исходном Excel-файле нет даты начала отсчёта недель. Занятия без отметки недели показываются в обоих режимах.</p>`;
}
function renderHome(){
  main.innerHTML = `<div class="home-actions">
    <button class="primary" data-page="groups">Группы</button>
    <button class="primary" data-page="teachers">Преподаватели</button>
  </div>`;
}
function renderGroups(){
  const items = GROUPS.filter(g=>g.course===selectedCourse);
  main.innerHTML = `<h1 class="page-title">Выбор группы</h1>
    <p class="subtle">Сначала выбери курс, затем свою группу</p>
    <div class="selector-wrap">
      <label class="field-label" for="courseSelect">Курс</label>
      <select id="courseSelect">
        ${[1,2,3,4].map(n=>`<option value="${n}" ${selectedCourse===n?"selected":""}>${n} курс</option>`).join("")}
      </select>
    </div>
    <div class="group-grid">
      ${items.map(g=>`<button class="primary group-card" data-group="${esc(g.id)}">
        <strong>${esc(g.code)}</strong>
        <small>${esc(g.direction)}</small>
        <span class="profile">${esc(g.shortProfile)}</span>
      </button>`).join("")}
    </div>
    ${items.length?"":'<div class="empty">Для этого курса группы не найдены.</div>'}`;
}
function eventCard(e){
  const special = e.week !== "all";
  const weekBadge = e.week==="even" ? "Чётная неделя" : e.week==="odd" ? "Нечётная неделя" : "Каждую неделю";
  return `<div class="lesson ${special?"special":""}">
    <div class="lesson-time">${esc(e.time)}</div>
    <div class="lesson-body">
      <div class="lesson-subject">${esc(e.subject)}</div>
      ${e.teacher?`<div class="lesson-meta">${esc(e.teacher)}</div>`:""}
      ${e.room?`<div class="lesson-room">Аудитория: ${esc(e.room)}</div>`:""}
      <div class="lesson-badges"><span class="pill ${special?"":"regular"}">${weekBadge}</span>
      ${(e.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join("")}</div>
    </div>
  </div>`;
}
function renderSchedule(){
  const g=currentGroup();
  if(!g){page="groups";render();return;}
  const events=visibleEvents(g.events);
  const extras=visibleEvents(g.extra||[]);
  main.innerHTML = `<div class="schedule-head">
      <h2>${esc(g.code)}</h2>
      <p>${esc(g.direction)}<br>${esc(g.shortProfile)}</p>
    </div>
    ${weekControl()}
    ${g.courseNote?`<p class="note">${esc(g.courseNote)}</p>`:""}
    ${DAYS.map(day=>{
      const dayEvents=events.filter(e=>e.day===day);
      return `<section class="day"><div class="day-title">${day}</div>
        ${dayEvents.length?dayEvents.map(eventCard).join(""):'<div class="empty">Занятий нет</div>'}
      </section>`;
    }).join("")}
    ${extras.length?`<section class="day"><div class="day-title">Дополнительные занятия без указанного времени</div>
      ${extras.map(e=>`<div class="lesson ${e.week!=="all"?"special":""}">
        <div class="lesson-time">Без времени</div><div class="lesson-body">
          <div class="lesson-subject">${esc(e.subject)}</div>
          ${e.teacher?`<div class="lesson-meta">${esc(e.teacher)}</div>`:""}
          ${e.room?`<div class="lesson-room">Аудитория / платформа: ${esc(e.room)}</div>`:""}
          <div class="lesson-badges"><span class="pill">${e.week==="even"?"Чётная неделя":e.week==="odd"?"Нечётная неделя":"Каждую неделю"}</span></div>
        </div></div>`).join("")}
    </section>`:""}`;
}
const teacherNames = [...new Set(GROUPS.flatMap(g=>g.events.map(e=>e.teacher).filter(Boolean)))].sort((a,b)=>a.localeCompare(b,"ru"));
function renderTeachers(){
  const list=teacherNames.filter(t=>t.toLocaleLowerCase("ru").includes(teacherSearch.toLocaleLowerCase("ru")));
  main.innerHTML = `<h1 class="page-title">Преподаватели</h1>
    <p class="subtle">Найди преподавателя, чтобы посмотреть его занятия</p>
    <div class="selector-wrap"><input class="search" id="teacherSearch" placeholder="Поиск преподавателя..." value="${esc(teacherSearch)}"></div>
    <div class="teacher-list">${list.map(t=>{
      const count=GROUPS.reduce((n,g)=>n+g.events.filter(e=>e.teacher===t).length,0);
      return `<button class="teacher-card" data-teacher="${esc(t)}">${esc(t)}<small>${count} занятий в таблице</small></button>`;
    }).join("")}</div>
    ${list.length?"":'<div class="empty">Ничего не найдено.</div>'}`;
}
function renderTeacherSchedule(){
  const found=[];
  GROUPS.forEach(g=>{
    g.events.forEach(e=>{
      if(e.teacher===selectedTeacher && (e.week==="all"||e.week===week))
        found.push({...e,group:g});
    });
    (g.extra||[]).forEach(e=>{
      if(e.teacher===selectedTeacher && (e.week==="all"||e.week===week))
        found.push({...e,day:"Дополнительно",time:"Без времени",group:g});
    });
  });
  found.sort((a,b)=>DAYS.indexOf(a.day)-DAYS.indexOf(b.day)||TIMES.indexOf(a.time)-TIMES.indexOf(b.time));
  main.innerHTML = `<div class="schedule-head"><h2>${esc(selectedTeacher)}</h2><p>Расписание преподавателя</p></div>
    ${weekControl()}
    ${DAYS.map(day=>{
      const lessons=found.filter(e=>e.day===day);
      return `<section class="day"><div class="day-title">${day}</div>
      ${lessons.length?lessons.map(e=>`<div class="teacher-lesson ${e.week!=="all"?"special":""}">
        <div class="lesson-time">${esc(e.time)}</div><div class="lesson-body">
          <div class="lesson-subject">${esc(e.subject)}</div>
          <div class="group-tag">${esc(e.group.code)} · ${esc(e.group.direction)}</div>
          ${e.room?`<div class="lesson-room">Аудитория: ${esc(e.room)}</div>`:""}
          <div class="lesson-badges"><span class="pill">${e.week==="all"?"Каждую неделю":e.week==="even"?"Чётная неделя":"Нечётная неделя"}</span></div>
        </div></div>`).join(""):'<div class="empty">Занятий нет</div>'}
      </section>`;
    }).join("")}
    ${found.some(e=>e.day==="Дополнительно")?`<section class="day"><div class="day-title">Дополнительные занятия без указанного времени</div>
      ${found.filter(e=>e.day==="Дополнительно").map(e=>`<div class="teacher-lesson ${e.week!=="all"?"special":""}">
        <div class="lesson-time">Без времени</div><div class="lesson-body">
          <div class="lesson-subject">${esc(e.subject)}</div>
          <div class="group-tag">${esc(e.group.code)} · ${esc(e.group.direction)}</div>
          ${e.room?`<div class="lesson-room">Аудитория / платформа: ${esc(e.room)}</div>`:""}
        </div></div>`).join("")}
    </section>`:""}`;
}
function render(){
  backBtn.hidden=page==="home";
  if(page==="home")renderHome();
  if(page==="groups")renderGroups();
  if(page==="schedule")renderSchedule();
  if(page==="teachers")renderTeachers();
  if(page==="teacherSchedule")renderTeacherSchedule();
}
function goBack(){
  if(page==="schedule")page="groups";
  else if(page==="teacherSchedule")page="teachers";
  else page="home";
  render();
}
backBtn.addEventListener("click",goBack);
document.getElementById("bellBtn").addEventListener("click",()=>{
  document.getElementById("modalRoot").innerHTML=`<div class="modal-backdrop" data-close="1"><div class="modal">
    <h3>🔔 Уведомления</h3><p>Пока уведомлений нет. Здесь можно будет разместить объявления об изменениях в расписании.</p>
    <button class="primary" data-close="1">Понятно</button></div></div>`;
});
document.getElementById("modalRoot").addEventListener("click",e=>{
  if(e.target.dataset.close)document.getElementById("modalRoot").innerHTML="";
});
document.addEventListener("click",e=>{
  const pageBtn=e.target.closest("[data-page]");
  if(pageBtn){page=pageBtn.dataset.page;render();return;}
  const groupBtn=e.target.closest("[data-group]");
  if(groupBtn){selectedGroupId=groupBtn.dataset.group;page="schedule";render();return;}
  const teacherBtn=e.target.closest("[data-teacher]");
  if(teacherBtn){selectedTeacher=teacherBtn.dataset.teacher;page="teacherSchedule";render();return;}
  const weekBtn=e.target.closest("[data-week]");
  if(weekBtn){week=weekBtn.dataset.week;render();return;}
});
document.addEventListener("change",e=>{
  if(e.target.id==="courseSelect"){selectedCourse=Number(e.target.value);renderGroups();}
});
document.addEventListener("input",e=>{
  if(e.target.id==="teacherSearch"){
    const start=e.target.selectionStart;
    teacherSearch=e.target.value;
    renderTeachers();
    const field=document.getElementById("teacherSearch");
    field.focus();field.setSelectionRange(start,start);
  }
});
render();
</script>
</body>
</html>
